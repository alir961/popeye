name: popeye

x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}

services:

  poll:
    build: ./poll
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - poll-tier

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - poll-tier
      - back-tier

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      <<: *db-credentials
      REDIS_HOST: redis
      DB_HOST: db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  db:
    image: postgres:14.13-alpine
    restart: unless-stopped
    environment:
      <<: *db-credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - result-tier
      - back-tier

  result:
    build: ./result
    restart: unless-stopped
    environment:
      <<: *db-credentials
      DB_HOST: db
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - result-tier

networks:
  poll-tier:
  result-tier:
  back-tier:

volumes:
  db-data:
