version: "3"
services:

  poll:
    build: ./poll
    restart: always
    ports:
      - "5000:80"
    environment:
      - REDIS_HOSTNAME=redis
    networks:
      - poll-tier

  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - POLL_HOSTNAME=poll
      - WORKER_HOSTNAME=worker
    networks:
      - poll-tier
      - back-tier

  worker:
    build: ./worker
    restart: always
    environment:
      - DB_HOSTNAME=db
      - REDIS_HOSTNAME=redis
    networks:
      - back-tier

  db:
    image: postgres:14.0
    restart: always
    environment:
      - WORKER_HOSTNAME=worker
      - RESULT_HOSTNAME=result
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres  
    networks:
      - result-tier
      - back-tier
    volumes:
      - db-data:/var/lib/postgresql/data
      - "./schema.sql:/docker-entrypoint-initdb.d/schema.sql"

  result:
    build: ./result
    restart: always
    ports:
      - "5001:80"
    environment:
      - DB_HOSTNAME=db
    networks:
      - result-tier

networks:  
  poll-tier:
  result-tier:
  back-tier:

volumes:
  db-data:
